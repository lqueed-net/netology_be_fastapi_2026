[pytest]
# Configuration for pytest

# Directories to search for tests
testpaths = tests

# Patterns for finding test files
python_files = test_*.py *_test.py

# Patterns for finding test functions
python_functions = test_*

# Patterns for finding test classes
python_classes = Test*

# Verbosity level of output
verbosity = 1

# Color output
color = yes

# Traceback style
tbstyle = auto

# Async mode for pytest-asyncio
asyncio_mode = auto

# Markers for tests
markers =
    math: Mathematical tests
    logic: Logic tests
    integration: Integration tests
    slow: Slow running tests
    web: Web tests requiring internet
    unit: Unit tests

# Exclusions for test collection
norecursedirs = .git .tox dist build *.egg

# Additional options
addopts =
    --strict-markers
    --strict-config
    -ra
    --showlocals

# Coverage configuration (if coverage.py is installed)
[coverage:run]
source = .

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError